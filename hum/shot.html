<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hum — shots (dev)</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #101012;
        color: #d8d8dc;
        font: 13px/1.4 system-ui, sans-serif;
      }
      #app {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 14px;
        box-sizing: border-box;
        height: 100%;
      }
      #shot {
        display: block;
        max-width: 100%;
        height: calc(100% - 96px);
        min-height: 0;
        background: #000;
        cursor: crosshair;
      }
      #bar {
        display: flex;
        align-items: center;
        gap: 10px;
        width: min(100%, 1280px);
        flex-wrap: wrap;
      }
      #bar button,
      #bar label.file,
      #bar input[type='text'] {
        font: inherit;
        color: inherit;
        background: #1e1e22;
        border: 1px solid #34343a;
        border-radius: 6px;
        padding: 5px 11px;
        cursor: pointer;
      }
      #bar input[type='text'] {
        width: 190px;
        cursor: text;
      }
      #bar label.file input {
        display: none;
      }
      #scrub {
        flex: 1;
        min-width: 160px;
      }
      #read {
        font: 12px ui-monospace, monospace;
        min-width: 210px;
      }
      #hint {
        margin: 0;
        color: #8a8a92;
        width: min(100%, 1280px);
      }
    </style>
  </head>
  <body>
    <!-- Dev only (not part of the build): a short run of hand-built shots (footage, flat colour, shapes,
         type, one of Hum's looks, speed ramps) played against a song. See src/dev/shot.ts -->
    <div id="app">
      <canvas id="shot"></canvas>
      <div id="bar">
        <button id="play">Play</button>
        <input id="scrub" type="range" min="0" max="1" step="0.0005" value="0" />
        <span id="read"></span>
        <label class="file">Clips<input id="clip" type="file" accept="video/*" multiple /></label>
        <label class="file">Song<input id="song" type="file" accept="audio/*,video/*" /></label>
        <input id="word" type="text" maxlength="60" placeholder="words to set in type" />
      </div>
      <p id="hint"></p>
    </div>
    <script type="module" src="/src/dev/shot.ts"></script>
  </body>
</html>
